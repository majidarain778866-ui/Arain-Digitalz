<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="pBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="pGlowOrange" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ff451d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff451d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlowEmerald" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="1280" height="720" fill="url(#pBgGrad)"/>
  <circle cx="950" cy="180" r="450" fill="url(#pGlowOrange)"/>
  <circle cx="250" cy="550" r="400" fill="url(#pGlowEmerald)"/>

  <!-- Browser Frame -->
  <g filter="url(#pShadow)">
    <rect x="40" y="30" width="1200" height="660" rx="16" fill="#0c0c0f" stroke="#26262a" stroke-width="1.5"/>
    <rect x="40" y="30" width="1200" height="42" rx="16" fill="#141418"/>
    <path d="M40 72 h1200 v1 h-1200 z" fill="#26262a"/>

    <circle cx="68" cy="51" r="6" fill="#ef4444"/>
    <circle cx="88" cy="51" r="6" fill="#f59e0b"/>
    <circle cx="108" cy="51" r="6" fill="#10b981"/>

    <rect x="380" y="40" width="520" height="24" rx="12" fill="#09090b" stroke="#26262a" stroke-width="1"/>
    <text x="640" y="56" fill="#888888" font-size="11" text-anchor="middle" class="font-mono">https://araindigitalz.netlify.app/#projects</text>

    <!-- Section Header -->
    <g transform="translate(640, 115)" text-anchor="middle">
      <rect x="-60" y="-15" width="120" height="24" rx="12" fill="#ff451d" fill-opacity="0.12" stroke="#ff451d" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="1" fill="#ff6b3d" font-size="10" font-weight="700" class="font-mono" letter-spacing="1">PORTFOLIO</text>
      <text x="0" y="38" fill="#ffffff" font-size="28" font-weight="700" class="font-sans">Featured Project Showcase</text>
      <text x="0" y="60" fill="#9ca3af" font-size="13" class="font-sans">Curated digital architecture and technical implementations.</text>
    </g>

    <!-- 3 Project Cards Grid -->
    <g transform="translate(80, 205)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="350" height="440" rx="18" fill="#111115" stroke="#232328" stroke-width="1.5"/>
        <rect x="15" y="15" width="320" height="190" rx="12" fill="#1e1e24"/>
        <!-- Card graphic placeholder -->
        <rect x="15" y="15" width="320" height="190" rx="12" fill="#ff451d" fill-opacity="0.08"/>
        <circle cx="175" cy="110" r="35" fill="#ff451d" fill-opacity="0.2"/>
        <text x="175" y="116" fill="#ff451d" font-size="20" font-weight="700" text-anchor="middle" class="font-mono">01</text>
        
        <text x="25" y="235" fill="#ff451d" font-size="10" font-weight="700" class="font-mono" letter-spacing="0.5">PLATFORM &amp; UX/UI</text>
        <text x="25" y="260" fill="#ffffff" font-size="18" font-weight="700" class="font-sans">Aether Portal</text>
        <text x="25" y="285" fill="#9ca3af" font-size="12" class="font-sans">Real-time telemetry and cloud client experience platform.</text>
        <text x="25" y="305" fill="#9ca3af" font-size="12" class="font-sans">Engineered for 60fps interaction rendering.</text>
        
        <!-- Tech Pills -->
        <g transform="translate(25, 340)">
          <rect x="0" y="0" width="55" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="27" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">React</text>
          
          <rect x="65" y="0" width="75" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="102" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">TypeScript</text>

          <rect x="150" y="0" width="60" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="180" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">Tailwind</text>
        </g>

        <!-- View Case Study Link -->
        <g transform="translate(25, 395)">
          <text x="0" y="15" fill="#ffffff" font-size="12" font-weight="600" class="font-sans">Explore Case Study ↗</text>
        </g>
      </g>

      <!-- Card 2 -->
      <g transform="translate(385, 0)">
        <rect width="350" height="440" rx="18" fill="#111115" stroke="#232328" stroke-width="1.5"/>
        <rect x="15" y="15" width="320" height="190" rx="12" fill="#1e1e24"/>
        <rect x="15" y="15" width="320" height="190" rx="12" fill="#3b82f6" fill-opacity="0.08"/>
        <circle cx="175" cy="110" r="35" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="175" y="116" fill="#3b82f6" font-size="20" font-weight="700" text-anchor="middle" class="font-mono">02</text>

        <text x="25" y="235" fill="#3b82f6" font-size="10" font-weight="700" class="font-mono" letter-spacing="0.5">CRYPTOGRAPHIC INTERACTION</text>
        <text x="25" y="260" fill="#ffffff" font-size="18" font-weight="700" class="font-sans">Krypton Protocol</text>
        <text x="25" y="285" fill="#9ca3af" font-size="12" class="font-sans">High-frequency distributed network visualization and</text>
        <text x="25" y="305" fill="#9ca3af" font-size="12" class="font-sans">security transaction latency matrix.</text>

        <g transform="translate(25, 340)">
          <rect x="0" y="0" width="60" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="30" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">Web3.js</text>

          <rect x="70" y="0" width="80" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="110" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">Motion V12</text>

          <rect x="160" y="0" width="50" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="185" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">Go API</text>
        </g>

        <g transform="translate(25, 395)">
          <text x="0" y="15" fill="#ffffff" font-size="12" font-weight="600" class="font-sans">Explore Case Study ↗</text>
        </g>
      </g>

      <!-- Card 3 -->
      <g transform="translate(770, 0)">
        <rect width="350" height="440" rx="18" fill="#111115" stroke="#232328" stroke-width="1.5"/>
        <rect x="15" y="15" width="320" height="190" rx="12" fill="#1e1e24"/>
        <rect x="15" y="15" width="320" height="190" rx="12" fill="#10b981" fill-opacity="0.08"/>
        <circle cx="175" cy="110" r="35" fill="#10b981" fill-opacity="0.2"/>
        <text x="175" y="116" fill="#10b981" font-size="20" font-weight="700" text-anchor="middle" class="font-mono">03</text>

        <text x="25" y="235" fill="#10b981" font-size="10" font-weight="700" class="font-mono" letter-spacing="0.5">DESIGN SYSTEM AUTOMATION</text>
        <text x="25" y="260" fill="#ffffff" font-size="18" font-weight="700" class="font-sans">Novis Design Engine</text>
        <text x="25" y="285" fill="#9ca3af" font-size="12" class="font-sans">Automated token extraction pipeline synchronizing</text>
        <text x="25" y="305" fill="#9ca3af" font-size="12" class="font-sans">Figma components with zero-regression code.</text>

        <g transform="translate(25, 340)">
          <rect x="0" y="0" width="70" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="35" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">Figma API</text>

          <rect x="80" y="0" width="70" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="115" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">Node.js</text>

          <rect x="160" y="0" width="60" height="22" rx="6" fill="#18181d" stroke="#2b2b33" stroke-width="1"/>
          <text x="190" y="15" fill="#cbd5e1" font-size="10" text-anchor="middle" class="font-mono">Tailwind</text>
        </g>

        <g transform="translate(25, 395)">
          <text x="0" y="15" fill="#ffffff" font-size="12" font-weight="600" class="font-sans">Explore Case Study ↗</text>
        </g>
      </g>
    </g>

  </g>
</svg>

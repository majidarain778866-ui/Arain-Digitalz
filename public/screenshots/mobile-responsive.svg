<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="50%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
    <radialGradient id="mGlowOrange" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff451d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff451d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mGlowRed" cx="70%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#ea4335" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ea4335" stop-opacity="0"/>
    </radialGradient>
    <filter id="mDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="1280" height="720" fill="url(#mBgGrad)"/>
  <circle cx="400" cy="300" r="450" fill="url(#mGlowOrange)"/>
  <circle cx="950" cy="450" r="400" fill="url(#mGlowRed)"/>

  <!-- Left: Desktop View Snapshot Panel -->
  <g transform="translate(80, 80)" filter="url(#mDrop)">
    <rect width="680" height="540" rx="16" fill="#0f0f13" stroke="#26262a" stroke-width="1.5"/>
    <rect width="680" height="38" rx="16" fill="#15151a"/>
    <path d="M0 38 h680 v1 h-680 z" fill="#26262a"/>

    <circle cx="25" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="19" r="5" fill="#10b981"/>

    <!-- Desktop content preview -->
    <g transform="translate(40, 70)">
      <text x="0" y="30" fill="#ff451d" font-size="11" font-weight="700" class="font-mono">VERIFIED GMAIL INTEGRATION</text>
      <text x="0" y="65" fill="#ffffff" font-size="26" font-weight="800" class="font-sans">Direct Dispatch to majidarain778866@gmail.com</text>
      <text x="0" y="95" fill="#9ca3af" font-size="13" class="font-sans">Authenticated Google Sign-In with OAuth 2.0 token security.</text>

      <!-- Mock modal dialog -->
      <g transform="translate(0, 130)">
        <rect width="600" height="290" rx="14" fill="#141418" stroke="#ff451d" stroke-opacity="0.3" stroke-width="1.5"/>
        <rect x="20" y="20" width="34" height="34" rx="8" fill="#ff451d" fill-opacity="0.15"/>
        <text x="37" y="42" fill="#ff451d" font-size="16" text-anchor="middle">✉</text>
        <text x="65" y="36" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">Connect with Majid</text>
        <text x="65" y="52" fill="#71717a" font-size="11" class="font-mono">Direct dispatch to majidarain778866@gmail.com</text>

        <!-- Google button -->
        <rect x="20" y="80" width="560" height="44" rx="10" fill="#ffffff"/>
        <text x="300" y="108" fill="#1f2937" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">✓ Verified with Google (majidarain778866@gmail.com)</text>

        <!-- Inputs preview -->
        <rect x="20" y="140" width="560" height="38" rx="8" fill="#0d0d10" stroke="#2b2b30" stroke-width="1"/>
        <text x="35" y="164" fill="#71717a" font-size="12" class="font-sans">Subject: SEO &amp; Custom WordPress Project Inquiry</text>

        <rect x="20" y="190" width="560" height="60" rx="8" fill="#0d0d10" stroke="#2b2b30" stroke-width="1"/>
        <text x="35" y="215" fill="#71717a" font-size="12" class="font-sans">Message: Discussing organic traffic scaling &amp; performance audits...</text>

        <!-- Send button -->
        <rect x="20" y="260" width="160" height="18" rx="9" fill="#ff451d"/>
        <text x="100" y="273" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">Send via Gmail ↗</text>
      </g>
    </g>
  </g>

  <!-- Right: Mobile Device Mockup Frame -->
  <g transform="translate(830, 45)" filter="url(#mDrop)">
    <!-- Smartphone Case -->
    <rect width="360" height="620" rx="42" fill="#121215" stroke="#2c2c34" stroke-width="3"/>
    <!-- Screen Glass -->
    <rect x="12" y="12" width="336" height="596" rx="32" fill="#09090b"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="130" y="22" width="100" height="22" rx="11" fill="#000000"/>
    <circle cx="210" cy="33" r="4.5" fill="#171717"/>

    <!-- Mobile Header -->
    <g transform="translate(30, 65)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#ff451d"/>
      <text x="30" y="16" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">Arain Digitalz</text>

      <!-- Hamburger button -->
      <g transform="translate(250, 4)" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="0" x2="18" y2="0"/>
        <line x1="0" y1="6" x2="18" y2="6"/>
      </g>
    </g>

    <!-- Mobile Content -->
    <g transform="translate(30, 115)">
      <rect x="0" y="0" width="120" height="20" rx="10" fill="#ff451d" fill-opacity="0.15"/>
      <text x="60" y="14" fill="#ff6230" font-size="9" font-weight="700" text-anchor="middle" class="font-mono">LEAD SPECIALIST</text>

      <text x="0" y="45" fill="#ffffff" font-size="20" font-weight="800" class="font-sans">M. Majid</text>
      <text x="0" y="65" fill="#a1a1aa" font-size="11" class="font-sans">SEO Expert &amp; WordPress Dev</text>

      <!-- Mobile Profile Circle -->
      <circle cx="150" cy="135" r="50" fill="#18181d" stroke="#ff451d" stroke-width="2"/>
      <circle cx="150" cy="135" r="42" fill="#ff451d" fill-opacity="0.2"/>
      <text x="150" y="142" fill="#ff451d" font-size="22" font-weight="700" text-anchor="middle" class="font-mono">M</text>

      <!-- Mobile Action CTA -->
      <rect x="0" y="210" width="300" height="42" rx="21" fill="#ffffff"/>
      <text x="150" y="236" fill="#000000" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">Start Project ↗</text>

      <rect x="0" y="265" width="300" height="42" rx="21" fill="#18181c" stroke="#333" stroke-width="1"/>
      <text x="150" y="291" fill="#ffffff" font-size="12" font-weight="500" text-anchor="middle" class="font-sans">Send via Gmail ✉</text>

      <!-- Metric Pills -->
      <rect x="0" y="325" width="140" height="60" rx="12" fill="#141418" stroke="#27272a" stroke-width="1"/>
      <text x="15" y="352" fill="#10b981" font-size="18" font-weight="700" class="font-sans">98%</text>
      <text x="15" y="370" fill="#71717a" font-size="9" class="font-mono">SPEED SCORE</text>

      <rect x="155" y="325" width="145" height="60" rx="12" fill="#141418" stroke="#27272a" stroke-width="1"/>
      <text x="170" y="352" fill="#ff451d" font-size="18" font-weight="700" class="font-sans">50+</text>
      <text x="170" y="370" fill="#71717a" font-size="9" class="font-mono">CLIENT PROJECTS</text>
    </g>

    <!-- Home Indicator -->
    <rect x="120" y="590" width="120" height="4" rx="2" fill="#4b5563"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040404"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff451d" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ff451d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff451d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="20%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3c00"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Filters for Glow -->
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glows -->
  <circle cx="640" cy="220" r="450" fill="url(#glowOrange)"/>
  <circle cx="200" cy="550" r="350" fill="url(#glowBlue)"/>

  <!-- Subtle Perspective Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Browser Window Wrapper -->
  <g filter="url(#shadowBox)">
    <!-- Browser Window Header Bar -->
    <rect x="40" y="30" width="1200" height="660" rx="16" fill="#0d0d10" stroke="#262626" stroke-width="1.5"/>
    <rect x="40" y="30" width="1200" height="42" rx="16" fill="#141418"/>
    <path d="M40 72 h1200 v1 h-1200 z" fill="#262626"/>

    <!-- Window Dots -->
    <circle cx="68" cy="51" r="6" fill="#ef4444"/>
    <circle cx="88" cy="51" r="6" fill="#f59e0b"/>
    <circle cx="108" cy="51" r="6" fill="#10b981"/>

    <!-- URL Pill -->
    <rect x="380" y="40" width="520" height="24" rx="12" fill="#0a0a0c" stroke="#262626" stroke-width="1"/>
    <text x="640" y="56" fill="#888888" font-size="11" text-anchor="middle" class="font-mono">https://araindigitalz.netlify.app</text>

    <!-- WEBSITE CONTENT INSIDE BROWSER -->

    <!-- 1. Header Bar -->
    <g transform="translate(60, 90)">
      <!-- Brand Logo -->
      <g>
        <rect x="0" y="2" width="28" height="28" rx="6" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
        <rect x="10" y="5" width="8" height="8" rx="2" fill="#ff451d"/>
        <rect x="3" y="12" width="8" height="8" rx="2" fill="#ff451d"/>
        <rect x="10" y="12" width="8" height="8" rx="2" fill="#ff451d"/>
        <rect x="10" y="19" width="8" height="8" rx="2" fill="#e63e1a"/>
        <text x="36" y="22" fill="#ffffff" font-size="16" font-weight="700" class="font-sans" letter-spacing="-0.5">Arain Digitalz</text>
        <circle cx="145" cy="18" r="3" fill="#10b981"/>
      </g>

      <!-- Center Navigation Capsule -->
      <rect x="360" y="0" width="460" height="34" rx="17" fill="#141416" fill-opacity="0.9" stroke="#2b2b30" stroke-width="1"/>
      <g transform="translate(378, 21)" fill="#d1d5db" font-size="11" font-weight="500" class="font-sans">
        <text x="0" y="0" fill="#ffffff">Features ▾</text>
        <text x="70" y="0">Projects</text>
        <text x="130" y="0">Team</text>
        <text x="180" y="0">Stack</text>
        <text x="230" y="0">How It Works</text>
        <text x="316" y="0">FAQ</text>
        <text x="360" y="0" fill="#ff451d">Contact</text>
      </g>

      <!-- Right Action Controls -->
      <g transform="translate(940, 0)">
        <!-- Search bar -->
        <rect x="0" y="3" width="90" height="28" rx="14" fill="#17171a" stroke="#2b2b30" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" stroke="#ff451d" stroke-width="1.5" fill="none"/>
        <line x1="19" y1="20" x2="23" y2="24" stroke="#ff451d" stroke-width="1.5"/>
        <text x="32" y="21" fill="#71717a" font-size="10" class="font-sans">Search...</text>

        <!-- Sound & Theme icon bubbles -->
        <circle cx="110" cy="17" r="14" fill="#17171a" stroke="#2b2b30" stroke-width="1"/>
        <circle cx="144" cy="17" r="14" fill="#17171a" stroke="#2b2b30" stroke-width="1"/>

        <!-- Start Project CTA Button -->
        <rect x="168" y="2" width="105" height="30" rx="15" fill="#ffffff"/>
        <text x="210" y="21" fill="#000000" font-size="11" font-weight="700" class="font-sans" text-anchor="middle">Start Project ↗</text>
      </g>
    </g>

    <!-- 2. Hero Section Center Stage -->
    <g transform="translate(640, 260)" text-anchor="middle">
      
      <!-- Top Pill Tag -->
      <rect x="-120" y="-30" width="240" height="28" rx="14" fill="#ff451d" fill-opacity="0.12" stroke="#ff451d" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="-95" cy="-16" r="3.5" fill="#ff451d"/>
      <text x="5" y="-12" fill="#ff7849" font-size="11" font-weight="600" class="font-mono" letter-spacing="1">NEXT-GEN DIGITAL CRAFT</text>

      <!-- Main Headline -->
      <text x="0" y="45" fill="url(#textGrad)" font-size="46" font-weight="800" class="font-sans" letter-spacing="-1.2">
        Building High-Impact Web Systems
      </text>
      <text x="0" y="100" fill="url(#textGrad)" font-size="46" font-weight="800" class="font-sans" letter-spacing="-1.2">
        &amp; Technical SEO Architectures
      </text>

      <!-- Subtitle -->
      <text x="0" y="145" fill="#9ca3af" font-size="15" font-weight="400" class="font-sans">
        Bespoke full-stack development, modern interaction design, and search engine dominancy
      </text>
      <text x="0" y="168" fill="#9ca3af" font-size="15" font-weight="400" class="font-sans">
        engineered for forward-thinking enterprises and ambitious brands.
      </text>

      <!-- CTA Buttons -->
      <g transform="translate(0, 205)">
        <!-- Primary Button -->
        <rect x="-160" y="0" width="150" height="44" rx="22" fill="url(#btnGrad)"/>
        <text x="-85" y="27" fill="#ffffff" font-size="13" font-weight="600" class="font-sans" text-anchor="middle">Start Project ↗</text>

        <!-- Secondary Gmail Button -->
        <rect x="10" y="0" width="150" height="44" rx="22" fill="#18181b" stroke="#333338" stroke-width="1"/>
        <text x="85" y="27" fill="#e4e4e7" font-size="13" font-weight="500" class="font-sans" text-anchor="middle">Direct Gmail ✉</text>
      </g>

      <!-- Floating Stat Cards in Hero -->
      <g transform="translate(-400, 20)">
        <rect x="-80" y="0" width="160" height="65" rx="12" fill="#111114" stroke="#26262a" stroke-width="1"/>
        <text x="-65" y="28" fill="#10b981" font-size="20" font-weight="700" class="font-sans" text-anchor="start">99.8%</text>
        <text x="-65" y="48" fill="#71717a" font-size="10" class="font-mono" text-anchor="start">CORE WEB VITALS</text>
      </g>

      <g transform="translate(400, 20)">
        <rect x="-80" y="0" width="160" height="65" rx="12" fill="#111114" stroke="#26262a" stroke-width="1"/>
        <text x="-65" y="28" fill="#ff451d" font-size="20" font-weight="700" class="font-sans" text-anchor="start">+42%</text>
        <text x="-65" y="48" fill="#71717a" font-size="10" class="font-mono" text-anchor="start">CONVERSION LIFT</text>
      </g>
    </g>

    <!-- 3. Bottom Showcase Bar -->
    <g transform="translate(60, 600)">
      <rect x="0" y="0" width="1160" height="64" rx="14" fill="#111114" stroke="#26262c" stroke-width="1"/>
      <g transform="translate(40, 36)" fill="#71717a" font-size="11" font-weight="600" class="font-mono">
        <text x="0" y="0" fill="#a1a1aa">CORE CAPABILITIES:</text>
        <text x="180" y="0">⚡ Technical SEO</text>
        <text x="340" y="0">🌐 WordPress CMS</text>
        <text x="520" y="0">⚛ React &amp; TypeScript</text>
        <text x="730" y="0">🎨 Luxury UX/UI</text>
        <text x="920" y="0" fill="#ff451d">✉ Verified Gmail API</text>
      </g>
    </g>

  </g>
</svg>
